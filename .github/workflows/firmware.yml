name: Firmware CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr make
      - name: Build both sensor variants
        run: make -C firmware all
      - name: Run application logic tests
        run: make -C firmware test
