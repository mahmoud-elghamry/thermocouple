# Hardware gate (I-021).
#
# The firmware has had CI since the start; the board has had none, so a change
# to the schematic or the generator could move the circuit while CI stayed
# green.
#
# What this protects: the PCB is frozen at REV A0 (docs/decisions/0010). The
# schematic may still be edited - it is being redrawn for readability (I-002) -
# but the connectivity it produces must not move, because the board was placed
# and routed from it and the Gerbers were made. This job exports the netlist
# from the committed schematic and compares it against the committed
# connectivity contract: 167 components, 154 nets, 555 pins.
#
# A failure here means either the schematic changed the circuit, or the
# baseline needs updating deliberately. Never update the baseline to make this
# pass - that is the check working.

name: Hardware

on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware.yml'

permissions:
  contents: read

jobs:
  connectivity-unchanged:
    runs-on: ubuntu-latest
    container:
      # KiCad 10: the schematic is saved in its format (version 20260306),
      # which KiCad 9 cannot open. ghcr.io, because docker.io rate-limits.
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Export the netlist from the committed schematic
        run: |
          kicad-cli sch export netlist \
            --output /tmp/current.net \
            hardware/8ch-old/thermocouple_8ch.kicad_sch

      - name: Compare against the REV A2 connectivity contract
        run: |
          python3 hardware/8ch-old/netlist_fingerprint.py \
            hardware/8ch-old/netlist-baseline-reva2.json \
            /tmp/current.net

      - name: No ERC errors
        run: |
          kicad-cli sch erc --severity-error --exit-code-violations \
            --output /tmp/erc.rpt hardware/8ch-old/thermocouple_8ch.kicad_sch \
            || { cat /tmp/erc.rpt; exit 1; }

      - name: Every passive still has an orderable part number
        run: python3 hardware/8ch-old/source_passives.py --check

  # 24-ch board (I-084): the generator rebuilds the schematic, which must come
  # out identical to the committed sheets; build.py itself fails on any ERC
  # error/warning or a netlist pin that differs from its model. Then DRC with
  # schematic parity and refilled zones, as fab.py runs it. Not here: pincaps.py
  # and the other pcbnew gates, which need KiCad's python.
  board-24ch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    env:
      KICAD_CLI: kicad-cli
      KICAD10_SYMBOL_DIR: /usr/share/kicad/symbols
    steps:
      - uses: actions/checkout@v4

      - name: Stock library tables (without them ERC warns lib_symbol_issues)
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/"

      - name: Schematic regenerates; ERC 0/0; netlist matches the model
        working-directory: hardware/24ch/gen
        run: python3 build.py

      - name: Regenerated sheets equal the committed ones
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code --stat -- 'hardware/24ch/*.kicad_sch'

      - name: DRC with schematic parity and refilled zones
        run: |
          kicad-cli pcb drc --schematic-parity --refill-zones --severity-error \
            --exit-code-violations --output /tmp/drc.rpt hardware/24ch/thermo24.kicad_pcb \
            || { cat /tmp/drc.rpt; exit 1; }
          cat /tmp/drc.rpt
